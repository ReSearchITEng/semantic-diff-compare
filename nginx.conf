server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text, code, JSON, YAML, TOML assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/yaml
        text/toml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-yaml
        image/svg+xml;

    # Security headers (HTTPS terminated by upstream reverse proxy)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Health check endpoint for container orchestrators and upstream Nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Cache immutable hashed Vite assets for 1 year
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ensure index.html is revalidated so updates take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Single Page Application fallback: route all unmatched requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
